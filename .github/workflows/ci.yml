name: core-regression-and-build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: offline-html-beta
          path: dist/index.html
          retention-days: 14
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/generate-example.mjs
      - run: python3 scripts/package_release.py
      - name: Publish research prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag --prerelease \
            --title "BRAIN_P $GITHUB_REF_NAME — research beta" \
            --notes-file docs/RELEASE_NOTES_BETA.md
